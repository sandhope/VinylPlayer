<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2c34"/>
      <stop offset="1" stop-color="#14141a"/>
    </linearGradient>
    <radialGradient id="label" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#ef8f22"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square icon background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Vinyl disc -->
  <circle cx="256" cy="256" r="192" fill="#0d0d10"/>

  <!-- Grooves -->
  <g fill="none" stroke="#26262c" stroke-width="2">
    <circle cx="256" cy="256" r="178"/>
    <circle cx="256" cy="256" r="164"/>
    <circle cx="256" cy="256" r="150"/>
    <circle cx="256" cy="256" r="136"/>
    <circle cx="256" cy="256" r="122"/>
    <circle cx="256" cy="256" r="108"/>
    <circle cx="256" cy="256" r="94"/>
    <circle cx="256" cy="256" r="80"/>
  </g>

  <!-- Light reflection -->
  <circle cx="256" cy="256" r="192" fill="url(#sheen)"/>

  <!-- Center label -->
  <circle cx="256" cy="256" r="66" fill="url(#label)"/>

  <!-- Play triangle -->
  <path d="M236 226 L236 286 L288 256 Z" fill="#1a1a1f"/>
</svg>
