name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build application
        run: wails build -platform windows/amd64 -clean -o VinylPlayer.exe

      - name: Package artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "VinylPlayer-$version-windows-amd64.zip"
          Compress-Archive -Path build/bin/VinylPlayer.exe -DestinationPath "build/bin/$zipName"

          # Generate SHA-256 checksums so users can verify their downloads.
          foreach ($file in @("VinylPlayer.exe", $zipName)) {
            $path = "build/bin/$file"
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower()
            "$hash *$file" | Out-File -FilePath "$path.sha256" -Encoding ascii
          }

      - name: Compose release body (download guide + auto notes)
        shell: pwsh
        run: |
          # 1) Let GitHub auto-generate the "What's Changed" section from commits/PRs.
          $notes = gh api repos/${{ github.repository }}/releases/generate-notes `
            -f tag_name="${{ github.ref_name }}" `
            -f target_commitish="${{ github.sha }}" `
            --jq '.body'
          if (-not $notes) { $notes = "" }

          # 2) Write the bilingual (EN + ZH) file download guide.
          $guide = @'
          ## 📦 Which file should I download? / 该下载哪个文件？

          | File | What it is | 中文说明 | Who should use it |
          |------|-----------|---------|-------------------|
          | `VinylPlayer.exe` | **Standalone executable** — download and double-click to run. No installation needed. | **绿色单文件** — 下载后双击即可运行，无需安装。 | Most users — the simplest option. |
          | `VinylPlayer-<ver>-windows-amd64.zip` | Same executable, **compressed** into a zip (smaller download). Unzip, then run `VinylPlayer.exe`. | 同一个可执行文件的 **压缩包**（体积更小），解压后运行 `VinylPlayer.exe`。 | Users on slow connections who prefer a smaller download. |
          | `*.sha256` | SHA-256 checksum files — verify your download is complete and untampered. | **SHA-256 校验文件** — 用于核对下载文件是否完整未被篡改。 | Anyone who wants to verify integrity. |

          > **Note:** all builds target **Windows x64** and require the WebView2 runtime (pre-installed on most Win10/11 systems).
          > **说明：** 所有构建均针对 **Windows x64**，需要 WebView2 运行时（大多数 Win10/11 已内置）。

          ## What's Changed

          '@

          Set-Content -Path release_body.md -Value ($guide + $notes) -Encoding utf8
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VinylPlayer ${{ github.ref_name }}
          body_path: release_body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            build/bin/VinylPlayer.exe
            build/bin/VinylPlayer-${{ github.ref_name }}-windows-amd64.zip
            build/bin/*.sha256
